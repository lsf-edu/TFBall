<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manager TFBall</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header class="topbar">
        <div class="brand"><img src="favicon.svg" alt="TFBall logo" class="brand-logo" />TFBall</div>
        <div class="tab-nav public-tabs" role="tablist" aria-label="Navigation du tournoi">
            <button class="tab-button active" data-tab="overview" role="tab" aria-selected="true"
                aria-label="Vue d’ensemble" title="Vue d’ensemble">
                <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
            </button>
            <button class="tab-button" data-tab="standings" role="tab" aria-selected="false" aria-label="Classement"
                title="Classement">
                <i class="fa-solid fa-ranking-star" aria-hidden="true"></i>
            </button>
            <button class="tab-button" data-tab="calendar" role="tab" aria-selected="false" aria-label="Calendrier"
                title="Calendrier">
                <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
            </button>
            <button class="tab-button" data-tab="results" role="tab" aria-selected="false" aria-label="Résultats"
                title="Résultats">
                <i class="fa-solid fa-trophy" aria-hidden="true"></i>
            </button>
            <button class="tab-button" data-tab="news" role="tab" aria-selected="false" aria-label="Actualités"
                title="Actualités">
                <i class="fa-regular fa-newspaper" aria-hidden="true"></i>
            </button>
        </div>
    </header>
    <main class="container">
        <section class="panel panel--compact">
            <div id="managerContent">Chargement des données...</div>
        </section>
    </main>
    <script>
        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function getHashParam(name) {
            const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            return hash.get(name);
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function buildAutoTeamLogo(teamName) {
            const safeName = (teamName || 'Equipe').trim().toUpperCase();
            const initials = safeName.split(/[^A-Z0-9]+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').slice(0, 2) || 'EQ';
            let hash = 0;
            for (let i = 0; i < safeName.length; i += 1) {
                hash = (hash << 5) - hash + safeName.charCodeAt(i);
                hash |= 0;
            }
            const hue = Math.abs(hash) % 360;
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
                    <rect width="96" height="96" rx="24" fill="hsl(${hue} 70% 18%)" />
                    <circle cx="48" cy="40" r="24" fill="hsla(0,0%,100%,0.16)" />
                    <path d="M24 76c6-15 18-24 24-24s18 9 24 24" fill="hsla(0,0%,100%,0.22)" />
                    <text x="48" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">${initials}</text>
                </svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function buildAutoTournamentLogo(name) {
            const safeName = (name || 'TFBall').trim().toUpperCase();
            const initials = safeName.split(/[^A-Z0-9]+/).filter(Boolean).slice(0, 3).map(part => part[0]).join('').slice(0, 3) || 'TF';
            let hash = 0;
            for (let i = 0; i < safeName.length; i += 1) {
                hash = (hash << 5) - hash + safeName.charCodeAt(i);
                hash |= 0;
            }
            const hue = Math.abs(hash) % 360;
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
                    <rect width="120" height="120" rx="28" fill="hsl(${hue} 70% 16%)" />
                    <circle cx="60" cy="54" r="28" fill="hsla(0,0%,100%,0.16)" />
                    <path d="M26 96c8-20 20-30 34-30s26 10 34 30" fill="hsla(0,0%,100%,0.2)" />
                    <text x="60" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">${initials}</text>
                </svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function getTournamentLogo(tournament) {
            if (!tournament) return buildAutoTournamentLogo('TFBall');
            if (tournament.logo) return tournament.logo;
            return buildAutoTournamentLogo(tournament.name || 'TFBall');
        }

        function renderTournamentBadge(tournament) {
            const logo = getTournamentLogo(tournament);
            return `
                <span class="tournament-badge">
                    <img class="tournament-badge__logo" src="${logo}" alt="${escapeHtml(tournament?.name || 'Tournoi')}" />
                    <span class="tournament-badge__name">${escapeHtml(tournament?.name || 'Tournoi')}</span>
                </span>
            `;
        }

        function getTeamLogo(tournament, teamName) {
            if (!teamName) return buildAutoTeamLogo('Equipe');
            if (tournament?.teamLogos?.[teamName]) return tournament.teamLogos[teamName];
            return buildAutoTeamLogo(teamName);
        }

        function renderTeamLabel(teamName, tournament) {
            if (!teamName || teamName === 'TBD' || teamName === 'BYE') {
                return `
                    <span class="team-badge team-badge--placeholder">
                        <span class="team-badge__name">À déterminer</span>
                    </span>
                `;
            }
            if (/^(1er|1ère|2e|2ème|3e|3ème|4e|4ème)\s/i.test(teamName)) {
                return `
                    <span class="team-badge team-badge--placeholder">
                        <span class="team-badge__name">${escapeHtml(teamName)}</span>
                    </span>
                `;
            }
            const logo = getTeamLogo(tournament, teamName);
            return `
                <span class="team-badge">
                    <img class="team-badge__logo" src="${logo}" alt="${escapeHtml(teamName)}" />
                    <span class="team-badge__name">${escapeHtml(teamName)}</span>
                </span>
            `;
        }

        function isForfeitMatch(match) {
            return !!match?.forfeit || !!match?.forfeitBoth;
        }

        function getMatchStatus(match) {
            if (isForfeitMatch(match)) return 'Forfait';
            return typeof match.scoreHome === 'number' && typeof match.scoreAway === 'number' ? 'Terminé' : 'À jouer';
        }

        function getMatchScoreText(match) {
            if (isForfeitMatch(match)) return 'Forfait';
            const homeScore = typeof match.scoreHome === 'number' ? match.scoreHome : '-';
            const awayScore = typeof match.scoreAway === 'number' ? match.scoreAway : '-';
            return `${homeScore} - ${awayScore}`;
        }

        function buildStandingTag(index, total) {
            if (index < 2) {
                return '<span class="standing-tag standing-tag--qualified">Qualifié</span>';
            }
            if (index >= total - 2) {
                return '<span class="standing-tag standing-tag--eliminated">Éliminé</span>';
            }
            return '<span class="standing-tag standing-tag--middle">À suivre</span>';
        }

        async function decodeTournamentPayload(value) {
            try {
                const bytes = Uint8Array.from(atob(String(value || '').replace(/-/g, '+').replace(/_/g, '/')), char => char.charCodeAt(0));
                let payloadText = null;

                if (typeof DecompressionStream === 'function') {
                    try {
                        const decompressedBytes = await new Response(
                            new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
                        ).arrayBuffer();
                        payloadText = new TextDecoder().decode(new Uint8Array(decompressedBytes));
                    } catch (error) {
                        payloadText = null;
                    }
                }

                if (!payloadText) {
                    payloadText = new TextDecoder().decode(bytes);
                }

                const payload = JSON.parse(payloadText);

                return {
                    id: payload.i,
                    name: payload.n,
                    type: payload.t,
                    status: payload.s,
                    season: payload.se,
                    champion: payload.c,
                    teams: payload.te || [],
                    table: (payload.ta || []).map(([team, points, goalDiff, played, badge]) => ({ team, points, goalDiff, played, badge })),
                    groups: (payload.g || []).map(group => ({
                        name: group.n,
                        standings: (group.st || []).map(([team, points, goalDiff, played, badge]) => ({ team, points, goalDiff, played, badge })),
                        rounds: (group.r || []).map(round => ({
                            name: round.n,
                            matches: (round.m || []).map(([home, away, scoreHome, scoreAway]) => ({
                                home,
                                away,
                                scoreHome,
                                scoreAway,
                                groupName: group.n
                            }))
                        }))
                    })),
                    bracket: (payload.br || []).map(round => ({
                        name: round.n,
                        matches: (round.m || []).map(([home, away, scoreHome, scoreAway]) => ({
                            home,
                            away,
                            scoreHome,
                            scoreAway
                        }))
                    }))
                };
            } catch (error) {
                console.error('Impossible de décoder le tournoi partagé.', error);
                return null;
            }
        }

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = window.indexedDB.open('TFBallDB', 1);
                request.onupgradeneeded = event => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('tournaments')) {
                        db.createObjectStore('tournaments', { keyPath: 'id' });
                    }
                };
                request.onsuccess = event => resolve(event.target.result);
                request.onerror = event => reject(event.target.error);
            });
        }

        async function loadTournament(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('tournaments', 'readonly');
                const store = tx.objectStore('tournaments');
                const request = store.get(id);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function buildOverviewCard(tournament) {
            const card = document.createElement('div');
            card.className = 'dashboard-card';
            card.innerHTML = `
                <div class="tournament-summary-hero">${renderTournamentBadge(tournament)}</div>
                <p><strong>Type :</strong> ${escapeHtml(tournament.type || 'Tournoi')}</p>
                <p><strong>Statut :</strong> ${escapeHtml(tournament.status || 'Ouvert')}</p>
                <p><strong>Saison :</strong> ${escapeHtml(tournament.season || 'Non précisée')}</p>
                <p><strong>Équipes :</strong> ${tournament.teams?.length || 0}</p>
                <div class="team-badge-list">
                    ${(tournament.teams || []).map(team => `<div class="team-badge-chip">${renderTeamLabel(team, tournament)}</div>`).join('')}
                </div>
                ${tournament.champion ? `<p><strong>Champion :</strong> ${escapeHtml(tournament.champion)}</p>` : ''}
            `;
            return card;
        }

        function buildStandingsSection(tournament) {
            const section = document.createElement('div');
            section.className = 'round-section';
            section.innerHTML = '<h4>Classement</h4>';

            if (tournament.type === 'GroupKnockout' && tournament.groups?.length) {
                tournament.groups.forEach(group => {
                    const groupCard = document.createElement('div');
                    groupCard.className = 'group-section';
                    groupCard.innerHTML = `<h5>${escapeHtml(group.name)}</h5>`;
                    const standings = (group.standings || []).length ? group.standings : [];
                    const table = document.createElement('table');
                    table.className = 'manager-table';
                    table.innerHTML = `
                        <thead><tr><th>#</th><th>Équipe</th><th>Pts</th><th>Diff</th><th>J</th></tr></thead>
                        <tbody>${standings.map((row, index) => `<tr class="${row.badge || ''}"><td>${index + 1}</td><td>${renderTeamLabel(row.team, tournament)}</td><td>${row.points}</td><td>${row.goalDiff}</td><td>${row.played}</td></tr>`).join('')}</tbody>
                    `;
                    groupCard.appendChild(table);
                    section.appendChild(groupCard);
                });
            }

            if (!tournament.type || tournament.type !== 'GroupKnockout') {
                if (tournament.table?.length) {
                    const overallCard = document.createElement('div');
                    overallCard.className = 'group-section';
                    overallCard.innerHTML = '<h5>Classement général</h5>';
                    const table = document.createElement('table');
                    table.className = 'manager-table';
                    table.innerHTML = `
                        <thead><tr><th>#</th><th>Équipe</th><th>Pts</th><th>Diff</th><th>J</th></tr></thead>
                        <tbody>${tournament.table.map((row, index) => `<tr class="${row.badge || ''}"><td>${index + 1}</td><td>${renderTeamLabel(row.team, tournament)}</td><td>${row.points}</td><td>${row.goalDiff}</td><td>${row.played}</td></tr>`).join('')}</tbody>
                    `;
                    overallCard.appendChild(table);
                    section.appendChild(overallCard);
                } else {
                    section.innerHTML += '<p>Aucun classement disponible.</p>';
                }
            }
            return section;
        }

        function buildCalendarSection(tournament) {
            const section = document.createElement('div');
            section.className = 'round-section';
            section.innerHTML = '<h4>Calendrier</h4>';

            if (tournament.type === 'GroupKnockout' && tournament.groups?.length) {
                const groupedByDay = new Map();
                tournament.groups.forEach(group => {
                    (group.rounds || []).forEach(round => {
                        if (!groupedByDay.has(round.name)) groupedByDay.set(round.name, []);
                        round.matches.forEach(match => {
                            groupedByDay.get(round.name).push({ ...match, groupName: group.name });
                        });
                    });
                });

                groupedByDay.forEach((matches, dayName) => {
                    const roundBox = document.createElement('div');
                    roundBox.className = 'calendar-round';
                    roundBox.innerHTML = `<div class="calendar-round__title">${escapeHtml(dayName)}</div>`;
                    const matchList = document.createElement('div');
                    matchList.className = 'calendar-match-list';
                    matches.forEach(match => {
                        const item = document.createElement('div');
                        item.className = 'calendar-match';
                        const scoreText = getMatchScoreText(match);
                        const status = getMatchStatus(match);
                        item.innerHTML = `
                            <div class="calendar-match__info">
                                <span class="calendar-match__status">${status}</span>
                                <span class="calendar-match__teams">
                                    <span>${renderTeamLabel(match.home, tournament)}</span>
                                    <span class="calendar-match__score">${scoreText}</span>
                                    <span>${renderTeamLabel(match.away, tournament)}</span>
                                </span>
                                <span class="calendar-match__group">${escapeHtml(match.groupName)}</span>
                            </div>
                        `;
                        matchList.appendChild(item);
                    });
                    roundBox.appendChild(matchList);
                    section.appendChild(roundBox);
                });
            }

            if (tournament.bracket?.length) {
                const list = document.createElement('div');
                list.className = 'calendar-feed';
                tournament.bracket.forEach(round => {
                    const roundBox = document.createElement('div');
                    roundBox.className = 'calendar-round';
                    roundBox.innerHTML = `<div class="calendar-round__title">${escapeHtml(round.name)}</div>`;
                    const matchList = document.createElement('div');
                    matchList.className = 'calendar-match-list';
                    round.matches.forEach(match => {
                        const item = document.createElement('div');
                        item.className = 'calendar-match';
                        const scoreText = getMatchScoreText(match);
                        const status = getMatchStatus(match);
                        item.innerHTML = `
                            <div class="calendar-match__info">
                                <span class="calendar-match__status">${status}</span>
                                <span class="calendar-match__teams">
                                    <span>${renderTeamLabel(match.home, tournament)}</span>
                                    <span class="calendar-match__score">${scoreText}</span>
                                    <span>${renderTeamLabel(match.away, tournament)}</span>
                                </span>
                            </div>
                        `;
                        matchList.appendChild(item);
                    });
                    roundBox.appendChild(matchList);
                    list.appendChild(roundBox);
                });
                section.appendChild(list);
            } else if (!tournament.type || tournament.type !== 'GroupKnockout') {
                section.innerHTML += '<p>Aucun calendrier disponible pour le moment.</p>';
            }
            return section;
        }

        function buildResultsSection(tournament) {
            const section = document.createElement('div');
            section.className = 'round-section';
            section.innerHTML = '<h4>Résultats</h4>';
            const playedMatches = (tournament.bracket || []).flatMap(round => (round.matches || []).filter(match => isForfeitMatch(match) || (typeof match.scoreHome === 'number' && typeof match.scoreAway === 'number')));
            if (!playedMatches.length) {
                section.innerHTML += '<p>Aucun résultat enregistré pour l’instant.</p>';
                return section;
            }
            const list = document.createElement('div');
            list.className = 'results-feed';
            playedMatches.forEach(match => {
                const item = document.createElement('div');
                item.className = 'result-card';
                const header = isForfeitMatch(match) ? 'Forfait' : 'Résultat final';
                const scoreText = getMatchScoreText(match);
                item.innerHTML = `
                    <div class="result-card__header">${header}</div>
                    <div class="result-card__teams">
                        <span class="result-card__team">${renderTeamLabel(match.home, tournament)}</span>
                        <span class="result-card__score">${scoreText}</span>
                        <span class="result-card__team">${renderTeamLabel(match.away, tournament)}</span>
                    </div>
                `;
                list.appendChild(item);
            });
            section.appendChild(list);
            return section;
        }

        function buildNewsSection(tournament) {
            const section = document.createElement('div');
            section.className = 'round-section';
            section.innerHTML = '<h4>Actualités</h4>';
            const newsItems = [];
            if (tournament.champion) {
                newsItems.push({ title: 'Champion confirmé', detail: `${tournament.champion} a remporté le tournoi.` });
            }
            const matches = (tournament.bracket || []).flatMap(round => (round.matches || []).map(match => ({ ...match, round: round.name })));
            const playedMatches = matches.filter(match => isForfeitMatch(match) || (typeof match.scoreHome === 'number' && typeof match.scoreAway === 'number'));
            const upcomingMatches = matches.filter(match => !isForfeitMatch(match) && (match.scoreHome == null || match.scoreAway == null));
            if (playedMatches.length) {
                const latest = playedMatches[playedMatches.length - 1];
                const detail = isForfeitMatch(latest) ? `${latest.home} vs ${latest.away} : Forfait` : `${latest.home} ${latest.scoreHome}-${latest.scoreAway} ${latest.away}`;
                newsItems.push({ title: 'Dernier résultat', detail });
            }
            if (upcomingMatches.length) {
                const nextMatch = upcomingMatches[0];
                newsItems.push({ title: 'Prochain match', detail: `${nextMatch.home} vs ${nextMatch.away} (${nextMatch.round})` });
            }
            if (!newsItems.length) {
                section.innerHTML += '<p>Aucune actualité pour le moment.</p>';
                return section;
            }
            const feed = document.createElement('div');
            feed.className = 'press-feed';
            newsItems.forEach(item => {
                const card = document.createElement('article');
                card.className = 'press-item';
                card.innerHTML = `<div class="press-item-title">${escapeHtml(item.title)}</div><div class="press-item-detail">${escapeHtml(item.detail)}</div>`;
                feed.appendChild(card);
            });
            section.appendChild(feed);
            return section;
        }

        function renderPublicView(tournament) {
            const container = document.createElement('div');
            container.className = 'public-view';
            return container;
        }

        function renderTabContent(tournament, tabName) {
            const container = document.getElementById('managerContent');
            const title = document.getElementById('panelTitle');
            const labels = {
                overview: 'Vue d’ensemble',
                standings: 'Classement',
                calendar: 'Calendrier',
                results: 'Résultats',
                news: 'Actualités'
            };
            container.innerHTML = '';
            if (title) {
                title.textContent = labels[tabName] || 'Vue d’ensemble';
            }
            if (tabName === 'overview') {
                container.appendChild(buildOverviewCard(tournament));
                return;
            }
            if (tabName === 'standings') {
                container.appendChild(buildStandingsSection(tournament));
                return;
            }
            if (tabName === 'calendar') {
                container.appendChild(buildCalendarSection(tournament));
                return;
            }
            if (tabName === 'results') {
                container.appendChild(buildResultsSection(tournament));
                return;
            }
            container.appendChild(buildNewsSection(tournament));
        }

        function attachTabEvents(tournament) {
            document.querySelectorAll('.public-tabs .tab-button').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.public-tabs .tab-button').forEach(other => {
                        other.classList.remove('active');
                        other.setAttribute('aria-selected', 'false');
                    });
                    button.classList.add('active');
                    button.setAttribute('aria-selected', 'true');
                    renderTabContent(tournament, button.dataset.tab);
                });
            });
        }

        async function initialize() {
            const content = document.getElementById('managerContent');
            const payload = getQueryParam('data') || getHashParam('d');
            const id = getQueryParam('id');
            let tournament = null;

            if (payload) {
                tournament = await decodeTournamentPayload(payload);
            }

            if (!tournament && id) {
                tournament = await loadTournament(id);
            }

            if (!tournament) {
                content.innerHTML = '<p>Tournoi introuvable. Vérifiez que vous avez créé et exporté le tournoi depuis l’application.</p>';
                return;
            }

            renderTabContent(tournament, 'overview');
            attachTabEvents(tournament);
        }

        initialize().catch(error => {
            document.getElementById('managerContent').innerHTML = `<p>Erreur de chargement : ${error.message}</p>`;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>

</html>
